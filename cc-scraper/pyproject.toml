[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-scraper"
version = "0.1.0"
description = "WoW auction house scraper for CoinCatcher"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
scraper = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff>=0.15.16",
]

# ===== RUFF (Linting + Formatting) =====
[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line-length handled by formatter
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== BASEDPYRIGHT (Type Checking) =====
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]

